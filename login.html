<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Paciente | CANNAPIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --accent: #52b788;
            --bg-light: #f4f6f5;
            --text-dark: #212529;
            --text-muted: #6c757d;
            --white: #ffffff;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--primary);
            background-image: linear-gradient(rgba(27, 67, 50, 0.85), rgba(27, 67, 50, 0.85));
            background-size: cover;
            background-position: center;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .login-card {
            background: var(--white);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        }

        .brand-logo {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo img {
            max-width: 180px;
            height: auto;
            object-fit: contain;
        }

        .login-card h3 {
            color: var(--text-dark);
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.15);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: var(--white);
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-light);
        }

        .register-link {
            margin-top: 1.5rem;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .register-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.8rem 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <img src="logo cannapis.jpg" alt="CANNAPIS Logo">
        </div>
        <h3>Área do Paciente</h3>
        <p>Entre com seu CPF e senha cadastrados</p>

        <form onsubmit="validarAcesso(event)">
            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="loginCpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginSenha" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Entrar na Conta</button>
        </form>

        <div class="register-link">
            Ainda não tem cadastro? <a href="#" onclick="bloquearCadastro(event)">Cadastre-se aqui</a>
        </div>

        <a href="index.html" class="back-link">← Voltar para a página inicial</a>
    </div>

    <script>
        function validarAcesso(event) {
            if (event) event.preventDefault();

            const usuario = document.getElementById('loginCpf').value.trim().toLowerCase();
            const senha = document.getElementById('loginSenha').value.trim();

            if (usuario === 'admin' && senha === 'admin') {
                window.location.href = 'admin-dashboard.html';
                return;
            }

            alert("Cadastros e acessos temporariamente indisponíveis. Por favor, faça contato com o suporte.");
        }

        function bloquearCadastro(event) {
            if (event) event.preventDefault();
            alert("Cadastros e acessos temporariamente indisponíveis. Por favor, faça contato com o suporte.");
        }

        function mascaraCPF(input) {
            let valor = input.value;
            if (/[a-zA-Z]/.test(valor)) {
                return;
            }

            let v = valor.replace(/\D/g, "");
            if (v.length > 11) v = v.slice(0, 11);
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            input.value = v;
        }
    </script>
</body>
</html>
