<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | CANNAPIS - Área do Paciente</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --accent: #52b788;
            --bg-light: #f8f9fa;
            --text-dark: #212529;
            --text-muted: #6c757d;
            --white: #ffffff;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgba(27, 67, 50, 0.95), rgba(45, 106, 79, 0.85)), url('2.jpg') center/cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .auth-card {
            background: var(--white);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .auth-logo {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: block;
            margin-bottom: 1.5rem;
        }

        .auth-logo span {
            color: var(--accent);
        }

        .auth-card h2 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ced4da;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.15);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: var(--white);
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(27, 67, 50, 0.2);
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
        }

        .back-home:hover {
            color: var(--white);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="auth-logo">🌱 CANNA<span>PIS</span></a>
        <h2>Cadastro de Paciente</h2>
        <p>Preencha os dados abaixo para criar sua conta</p>

        <form onsubmit="realizarCadastro(event)">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="nascimento">Data de Nascimento</label>
                <input type="date" id="nascimento" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha segura" required>
            </div>

            <button type="submit" class="btn-submit">Criar Cadastro</button>
        </form>

        <div class="auth-footer">
            Já possui uma conta? <a href="login.html">Faça login</a>
        </div>

        <a href="index.html" class="back-home">&larr; Voltar para a página inicial</a>
    </div>

    <script>
        // Função para formatar o CPF automaticamente e limitar os dígitos
        function mascaraCPF(input) {
            let v = input.value.replace(/\D/g, "");
            if (v.length > 11) v = v.slice(0, 11);

            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            input.value = v;
        }

        function realizarCadastro(evento) {
            evento.preventDefault();
            const nome = document.getElementById('nome').value;
            const cpfLimpo = document.getElementById('cpf').value.replace(/\D/g, '');

            if (cpfLimpo.length !== 11) {
                alert('Por favor, digite um CPF válido contendo exatamente 11 dígitos.');
                return;
            }

            // Salva o nome do paciente no navegador para exibir no dashboard
            localStorage.setItem('nomePaciente', nome);

            alert('Cadastro realizado com sucesso para: ' + nome + '!\nAgora você pode fazer o login.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
